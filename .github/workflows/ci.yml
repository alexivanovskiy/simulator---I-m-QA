name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверка index.html
        run: |
          if [ -f index.html ]; then
            echo "index.html найден — OK"
          else
            echo "index.html не найден"
            exit 1
          fi

      - name: Линтер HTML (HTMLHint)
        run: npx --yes htmlhint index.html

      - name: Заглушка сборки
        run: echo "Сборка (учебная заглушка) — OK"