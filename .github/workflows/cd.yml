name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # можно запустить вручную из Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Подготовить файлы для Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4